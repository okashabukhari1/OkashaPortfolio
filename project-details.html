  <style>
    /* ══════════════════════════════════════════════════════════════
       PROJECT DETAILS PAGE — CUSTOM STYLES
       ═════════════════════════════════════════════════════════════ */

    /* Hero Section */
    .project-hero {
      position: relative;
      height: 500px;
      overflow: hidden;
      margin-bottom: 60px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(160deg, var(--dark3), var(--dark2));
    }

    .project-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(5, 13, 26, .7) 100%);
    }

    /* Hero Status & Badge */
    .hero-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .hero-badge {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 100px;
      background: rgba(0, 212, 255, .15);
      border: 1.5px solid rgba(0, 212, 255, .35);
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero-badge i {
      font-size: .6rem;
    }

    .hero-badge.status-live i {
      color: #4ade80;
    }

    .hero-badge.status-dev i {
      color: #facc15;
    }

    .hero-badge.status-done i {
      color: #60a5fa;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 212, 255, .15);
      border: 1.5px solid rgba(0, 212, 255, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all .3s;
      text-decoration: none;
    }

    .back-btn:hover {
      background: rgba(0, 212, 255, .25);
      transform: translateY(-2px);
    }

    /* Project Details Content */
    .project-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 60px;
      flex-wrap: wrap;
    }

    .project-meta h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -.02em;
      line-height: 1.1;
    }

    .project-category {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-category i {
      font-size: .85rem;
    }

    .project-cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .project-cta .btn-primary,
    .project-cta .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Description Section */
    .project-description {
      background: linear-gradient(160deg, rgba(0, 212, 255, .05), rgba(10, 22, 40, .4));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 60px;
      line-height: 1.9;
      font-size: .95rem;
      color: var(--muted);
    }

    /* Two Column Section */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 60px;
    }

    .detail-section h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    /* Technologies List */
    .tech-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tech-tag {
      font-size: .75rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 100px;
      background: rgba(0, 212, 255, .1);
      border: 1.5px solid rgba(0, 212, 255, .25);
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .3s;
    }

    .tech-tag:hover {
      background: rgba(0, 212, 255, .2);
      border-color: rgba(0, 212, 255, .4);
      transform: translateY(-2px);
    }

    .tech-tag i {
      font-size: .65rem;
    }

    /* Features List */
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      transition: all .3s;
    }

    .feature-item:hover {
      background: rgba(0, 212, 255, .05);
    }

    .feature-item i {
      font-size: .9rem;
      color: var(--cyan);
      margin-top: 2px;
      flex-shrink: 0;
    }

    .feature-item span {
      font-size: .9rem;
      color: var(--text);
      line-height: 1.6;
    }

    /* Related Projects */
    .related-projects {
      margin-top: 80px;
      padding-top: 60px;
      border-top: 1px solid var(--border);
    }

    .related-projects h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 40px;
      text-align: center;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .related-grid .proj-card {
      height: 100%;
    }

    .related-grid .proj-visual {
      height: 200px;
    }

    @media (max-width: 1100px) {
      .related-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Project visual gradients */
    .pv1 {
      background: linear-gradient(135deg, #0f2460, #1e3a8a, #1d4ed8);
    }

    .pv2 {
      background: linear-gradient(135deg, #1c1c1e, #2d1b69, #4c1d95);
    }

    .pv3 {
      background: linear-gradient(135deg, #1a4d3a, #2d5f4a, #3a7a5a);
    }

    .pv4 {
      background: linear-gradient(135deg, #7c3aed, #a855f7, #c084fc);
    }

    .pv5 {
      background: linear-gradient(135deg, #6b2d3a, #8b3d4a, #a8445a);
    }

    .pv6 {
      background: linear-gradient(135deg, #2d4a5e, #3d5a7e, #4d6a9e);
    }

    /* Project Status Badge */
    .proj-status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 100px;
      background: rgba(0, 212, 255, .15);
      border: 1px solid rgba(0, 212, 255, .3);
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .proj-status i {
      font-size: .55rem;
      color: #4ade80;
    }

    .proj-status.status-live {
      background: rgba(74, 222, 128, .12);
      border-color: rgba(74, 222, 128, .3);
      color: #4ade80;
    }

    .proj-status.status-live i {
      color: #22c55e;
    }

    .proj-status.status-dev {
      background: rgba(250, 204, 21, .12);
      border-color: rgba(250, 204, 21, .3);
      color: #facc15;
    }

    .proj-status.status-dev i {
      color: #eab308;
    }

    .proj-status.status-done {
      background: rgba(96, 165, 250, .12);
      border-color: rgba(96, 165, 250, .3);
      color: #60a5fa;
    }

    .proj-status.status-done i {
      color: #3b82f6;
    }

    /* Project card styling */
    .pv-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 212, 255, .1), transparent 70%);
    }

    .pv-bg-label {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: rgba(255, 255, 255, .055);
      letter-spacing: -.04em;
      pointer-events: none;
      line-height: 1;
    }

    .pv-icon {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, .4));
    }

    /* Project card body */
    .proj-body {
      padding: 24px;
    }

    .proj-cat {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .proj-cat i {
      font-size: .65rem;
    }

    .proj-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -.01em;
    }

    .proj-desc {
      font-size: .76rem;
      color: var(--muted);
      line-height: 1.74;
      margin-bottom: 18px;
    }

    .proj-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .proj-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .ptag {
      font-size: .58rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 100px;
      background: rgba(0, 212, 255, .07);
      border: 1px solid rgba(0, 212, 255, .14);
      color: var(--cyan);
    }

    /* Project card from shared.css */
    .proj-card {
      background: linear-gradient(160deg, var(--dark3), var(--dark2));
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all .35s;
      position: relative;
      cursor: pointer;
    }

    .proj-card:hover {
      border-color: rgba(0, 212, 255, .3);
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3), 0 0 40px rgba(0, 212, 255, .06);
    }

    .proj-card:focus {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
      border-color: rgba(0, 212, 255, .3);
      transform: translateY(-4px);
    }

    .proj-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--cyan2));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .4s cubic-bezier(.16, 1, .3, 1);
    }

    .proj-card:hover::after {
      transform: scaleX(1);
    }

    .proj-visual {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: none;
    }

    /* Error State */
    .error-container {
      text-align: center;
      padding: 120px 40px;
    }

    .error-icon {
      font-size: 5rem;
      color: var(--cyan);
      margin-bottom: 30px;
      opacity: .3;
    }

    .error-container h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .error-container p {
      font-size: 1rem;
      color: var(--muted);
      max-width: 500px;
      margin: 0 auto 40px;
      line-height: 1.8;
    }

    /* Loading State */
    .loading-skeleton {
      background: linear-gradient(90deg, rgba(0, 212, 255, .1) 0%, rgba(0, 212, 255, .05) 50%, rgba(0, 212, 255, .1) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn .6s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .fade-in-delay-1 { animation-delay: .1s; }
    .fade-in-delay-2 { animation-delay: .2s; }
    .fade-in-delay-3 { animation-delay: .3s; }

    /* Responsive */
    @media (max-width: 900px) {
      .project-hero {
        height: 350px;
        margin-bottom: 40px;
      }

      .project-header {
        gap: 20px;
      }

      .project-description {
        padding: 30px;
      }

      .details-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .related-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .project-hero {
        height: 280px;
        margin-bottom: 30px;
        border-radius: 12px;
      }

      .hero-content {
        padding: 16px;
      }

      .project-meta h1 {
        font-size: clamp(1.3rem, 3.5vw, 2rem);
      }

      .project-cta {
        width: 100%;
      }

      .project-cta .btn-primary,
      .project-cta .btn-ghost {
        flex: 1;
        justify-content: center;
      }

      .project-description {
        padding: 20px;
        font-size: .9rem;
      }

      .details-grid {
        gap: 20px;
      }
    }
  </style>
</head>
